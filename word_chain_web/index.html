<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Chain</title>
  <meta name="description" content="Climb from one word to another, changing one letter at a time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="title">Word Chain</h1>
      <div class="top-actions">
        <label class="visually-hidden" for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button type="button" id="new-btn" class="btn">New puzzle</button>
      </div>
    </header>

    <p class="goal" id="goal">Loading words…</p>

    <ol class="ladder" id="ladder" aria-label="Your word chain"></ol>

    <p class="message" id="message" role="status" aria-live="polite"></p>

    <div class="controls" id="controls">
      <button type="button" id="hint-btn" class="btn">Hint</button>
      <button type="button" id="par-btn" class="btn">Show par</button>
      <button type="button" id="undo-btn" class="btn">Undo</button>
      <button type="button" id="answer-btn" class="btn btn-quiet">Show answer</button>
    </div>

    <section class="result" id="result" hidden>
      <h2 class="result-title" id="result-title"></h2>
      <p class="result-detail" id="result-detail"></p>
      <p class="result-solution" id="result-solution"></p>
      <button type="button" id="again-btn" class="btn btn-primary">Play again</button>
    </section>

    <details class="how">
      <summary>How to play</summary>
      <p>Change one letter at a time to turn the top word into the bottom word. Every step has to be a real word. Stuck or curious? Show par tells you the fewest moves it can be done in, and adds dashed rungs for the moves you have left to match it.</p>
    </details>
  </main>

  <script src="words.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
